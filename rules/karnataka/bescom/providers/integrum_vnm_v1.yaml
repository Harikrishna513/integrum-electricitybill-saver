# Integrum Energy — VNM service assumptions for individual residential comparison.
#
# Rates below are COMMERCIAL / ILLUSTRATIVE assumptions until a written provider quote exists.
# Never present them as an official Integrum tariff without a current commercial quote.

rule_version: INTEGRUM_VNM_V1_BOOTSTRAP
provider_name: Integrum Energy
provider_website: https://integrumenergy.in/
provider_contact_url: https://integrumenergy.in/contact/
effective_from: "2025-07-01"
effective_to: null
verification_status: REQUIRES_VERIFICATION
source: Integrum public site + KERC DSPV order 09.07.2025 + market Opex band
source_notes: >
  Integrum is positioned as a hybrid RE platform. Residential VNM Opex is modelled
  here as an illustrative subscription per solar kWh for sales comparison only.

subscription:
  model: opex_per_solar_kwh
  inr_per_kwh: 4.75
  market_low_inr_per_kwh: 2.5
  market_high_inr_per_kwh: 4.75
  gst_percent: 18.0
  description: Monthly VNM solar energy subscription (Opex, illustrative)

one_time:
  community_plant_capex_inr_per_kwp: 40000
  bescom_meter_fee_inr: 4500
  integrum_onboarding_inr_per_flat: 500
  gst_percent: 18.0
  description: Reserved for society calculator — unused in individual comparison

individual_scenario:
  # Pre-GST illustrative commercial assumption (config — not an official Integrum tariff).
  integrum_inr_per_kwh: 3.0
  # Sales explorer: 1 kWp ≈ 120 kWh/month (illustrative yield, not a generation guarantee).
  illustrative_monthly_kwh_per_kwp: 120
  min_plant_kwp: 0.5
  max_plant_kwp: 10.0
  plant_step_kwp: 0.5
  # Default plant sized to cover ~100% of monthly consumption (rounded up to step).
  default_full_offset: true
  label: Illustrative plant size — estimated monthly solar units
  description: >
    Consumers explore plant size (kWp). Estimated solar units = kWp × monthly
    kWh/kWp, capped at their consumption. Not an actual VNM allocation.

# Illustrative seasonal factors relative to the uploaded bill's monthly baseline.
# Not Bangalore-specific facts — planning assumptions only.
seasonal_model:
  label: Illustrative seasonal consumption factors
  # month number (1=Jan … 12=Dec) → factor vs baseline month consumption
  factors_by_month:
    1: 0.90   # Winter
    2: 0.90
    3: 1.10   # Pre-monsoon
    4: 1.15   # Summer
    5: 1.15
    6: 0.95   # Monsoon
    7: 0.95
    8: 0.95
    9: 1.00   # Post-monsoon
    10: 1.00
    11: 0.90  # Winter
    12: 0.90
  notes: >
    Factors are normalised to the uploaded bill month (= 1.0). Other months are
    relative to that month. Chart month 1 matches the comparison table totals.
    Not historical meter data.

# Reserved for a future society/community VNM calculator — not used in individual comparison.
apartment_assumptions:
  typical_flats: 20
  description: >
    Reserved for a separate Society/Community VNM Calculator.
  share_model: consumption_proportional_equal_flats
  min_plant_kwp: 5.0
  target_offset_fraction: 0.85

generation:
  specific_yield_kwh_per_kwp_year: 1480

user_messages:
  individual_banner: >
    This estimate uses only your confirmed bill. Solar coverage is an illustrative
    sales scenario — not your actual VNM allocation from a provider.
  credit_input_prompt: >
    Advanced: enter an expected solar credit (kWh) from a provider quote for this period.
  gruha_jyothi_note: >
    Your current bill already benefits from Gruha Jyothi. VNM may provide limited
    additional savings — review the comparison carefully.
  disclaimer_short: >
    Estimate only. Actual VNM savings depend on the provider's commercial rate,
    project generation, customer allocation and applicable BESCOM/KERC charges.
  no_subsidy: >
    PM Surya Ghar subsidy is not included in this VNM Opex model.
  cta_primary: Get your VNM proposal
  cta_secondary: Talk to Integrum
  cta_url: https://integrumenergy.in/contact/
