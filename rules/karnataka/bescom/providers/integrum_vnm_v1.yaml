# Integrum Energy — VNM service assumptions for apartment consumers.
#
# Integrum does not publish a flat residential VNM ₹/kWh tariff on their website.
# subscription_inr_per_kwh is a MARKET ASSUMPTION derived from:
#   - Integrum marketing: delivered RE power ~₹3–7/kWh vs grid (industrial clients)
#   - KERC FY 2025–26 domestic DSPV benchmark ₹3.86/kWh (export floor reference)
#   - Bangalore community-solar Opex quotes commonly ₹4.25–5.25/kWh credit delivered
# Reconcile with Integrum before production consumer quotes.

rule_version: INTEGRUM_VNM_V1_BOOTSTRAP
provider_name: Integrum Energy
provider_website: https://integrumenergy.in/
effective_from: "2025-07-01"
effective_to: null
verification_status: REQUIRES_VERIFICATION
source: Integrum public site + KERC DSPV order 09.07.2025 + market Opex band
source_notes: >
  Integrum is positioned as a hybrid RE platform for industrial/commercial clients.
  Residential apartment VNM is modeled here as an Opex subscription per solar kWh
  credited to the flat — lower than BESCOM retail but above KERC export tariff.

subscription:
  model: opex_per_solar_kwh
  inr_per_kwh: 4.75
  market_low_inr_per_kwh: 2.5
  market_high_inr_per_kwh: 4.75
  gst_percent: 18.0
  description: Monthly Integrum VNM solar credit subscription (Opex, no upfront plant cost)

one_time:
  # KERC FY 2025–26 domestic DSPV capital cost benchmark (Times of India / KERC order gist)
  community_plant_capex_inr_per_kwp: 40000
  # BESCOM smart meter / processing — market band ₹3,000–6,000 (Solar Karnataka 2026 guide)
  bescom_meter_fee_inr: 4500
  integrum_onboarding_inr_per_flat: 500
  gst_percent: 18.0
  description: One-time society setup (plant + metering + onboarding), split per flat

individual_scenario:
  # Integrum solar service rate for comparison (verify with Integrum quote).
  integrum_inr_per_kwh: 3.0
  description: >
    VNM solar credit must be entered by the user from their provider/society.
    Integrum rate is used only for the VNM service charge estimate.

# Reserved for a future society/community VNM calculator — not used in individual comparison.
apartment_assumptions:
  typical_flats: 20
  description: >
    We assume a typical 20-flat apartment society. Your solar share is estimated
    from your consumption vs assumed equal usage across flats. Integrum handles
    VNM registration with the society — you do not need neighbour RR numbers.
  share_model: consumption_proportional_equal_flats
  min_plant_kwp: 5.0
  target_offset_fraction: 0.85

generation:
  specific_yield_kwh_per_kwp_year: 1480

user_messages:
  individual_banner: >
    This comparison uses only your confirmed bill for BESCOM charges. Expected VNM
    solar credit must come from your VNM provider or society — it is not calculated
    from consumption, sanctioned load, or apartment assumptions.
  credit_input_prompt: >
    To estimate your VNM bill, enter the expected solar credit provided by your
    VNM provider or society for this billing period.
  no_subsidy: >
    PM Surya Ghar subsidy is not included in this VNM Opex model.
