# Virtual Net Metering (VNM) preliminary analysis rules — Milestone 16.
#
# Source of truth for product logic: versioned YAML (this file), not Gemini.
# Time-sensitive: Common SOP VNM & GNM dated 12.05.2026 and KERC order 09.07.2025.
# Re-check official BESCOM SRTPV / KERC documents before production claims.
#
# This engine does PRELIMINARY ANALYSIS only — never approval / sanction / PPA.

rule_version: VNM_BESCOM_SOP_2026_05_12_BOOTSTRAP
discom: BESCOM
arrangement: VIRTUAL_NET_METERING
effective_from: "2025-07-09"
effective_to: null
verification_status: REQUIRES_VERIFICATION
source: Common SOP VNM_GNM 12.05.2026 + KERC tariff order 09.07.2025 (gist)
source_url: https://srtpv.bescom.org/SRTPV/document/Common%20SOP%20VNM_GNM%2012.05.2026.pdf
source_notes: >
  Rules below are a structured bootstrap of the public SOP gist. Confirm against
  the full official PDF and any later amendments. Technical feasibility is always
  BESCOM's decision — this app only pre-screens.

eligibility:
  # SOP: Domestic, group housing, charitable institutions, government buildings,
  # local authority buildings. v1 apartment scenario focuses on DOMESTIC.
  eligible_categories:
    - DOMESTIC
    - GROUP_HOUSING
    - CHARITABLE
    - GOVERNMENT
    - LOCAL_AUTHORITY
  min_participating_consumers: 2
  require_same_category: true
  require_same_discom_area_declared: true

plant:
  min_kwp: 5.0
  # max = combined sanctioned load / contract demand of participants
  max_equals_combined_sanctioned_load: true

procurement:
  # Declared share % must sum to 100 (tolerance for rounding).
  shares_must_sum_to_percent: 100.0
  sum_tolerance_percent: 0.5
  # SOP: change share once at beginning of FY with 2 months advance notice.
  share_change_note: >
    Procurement ratio may be changed once at the beginning of a financial year
    with two months' advance notice (per SOP gist) — confirm officially.

generation_defaults:
  # Reuse Bengaluru-region planning yield unless caller supplies generation.
  specific_yield_kwh_per_kwp_year: 1480

settlement:
  # After apportioned credit vs consumption: retail on net import; surplus at
  # 75% of generic tariff for ground-mounted / DSPV (as applicable).
  excess_purchase_fraction_of_generic: 0.75
  generic_tariff_ground_or_dspv_inr_per_kwh: 3.66
  generic_tariff_verification_status: REQUIRES_VERIFICATION
  generic_tariff_note: >
    Bootstrap generic ₹/kWh for excess-purchase math only. Confirm the KERC
    generic tariff applicable on as_of for ground-mounted / DSPV projects.
  open_access_note: >
    Same DT / same 11 kV feeder may be exempt from OA charges; different feeders
    may attract OA charges — not computed here; flag only.
  technical_feasibility_note: >
    Technical feasibility is performed by BESCOM officers per SOP scenarios
    (same DT / feeder / substation / multi-substation). This app never clears it.

user_messages:
  never_approval: >
    Preliminary VNM analysis only — not BESCOM approval, sanction, PPA, or
    technical feasibility clearance.
  potentially_suitable: >
    Inputs appear consistent with published VNM pre-screen checks. Official
    feasibility, PPA, and metering still required via BESCOM SRTPV.
  potentially_unsuitable: >
    One or more published VNM pre-screen checks failed under current assumptions.
  insufficient: >
    Missing inputs prevent a complete VNM pre-screen.
  technical_verification: >
    Pre-screen passed basic numeric checks, but technical feasibility / OA /
    metering must be verified officially by BESCOM.
